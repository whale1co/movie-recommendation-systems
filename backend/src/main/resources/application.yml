server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_rec?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

movie:
  poster-dir: ${MOVIE_POSTER_DIR:./posters}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  ai:
    provider: ${LLM_PROVIDER:fake}
    base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen2.5:7b}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
    max-retries: ${LLM_MAX_RETRIES:1}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:2048}
    temperature: ${LLM_TEMPERATURE:0.2}
    retrieval-limit: ${AI_RETRIEVAL_LIMIT:8}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # The application must receive JWT_SECRET from the runtime environment.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window-seconds: ${LOGIN_WINDOW_SECONDS:900}
    lock-seconds: ${LOGIN_LOCK_SECONDS:900}
  ai:
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
    requests-per-day: ${AI_REQUESTS_PER_DAY:100}
